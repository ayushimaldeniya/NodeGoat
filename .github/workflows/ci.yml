name: DevSecOps CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-pipeline:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository with full commit history (essential for Gitleaks)
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate 1: Secrets Scanning (Gitleaks) - Member 1
      - name: Gate 1 - Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Step 2: Set up Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # Step 4: Run application tests
      - name: Run tests
        run: npm test
        continue-on-error: true

      # Gate 2a: SAST - broad scan (report only)
      - name: Gate 2a - Semgrep Auto Scan (report only)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto app/
        continue-on-error: true

      # Gate 2b: SAST - custom rules for our Section 2.3 fixes
      - name: Gate 2b - Semgrep Custom Rules (blocking verification)
        run: |
          semgrep scan --config nosql-injection-rule.yml --config elevation-of-privilege-rule.yml app/ --error
        continue-on-error: true

      # Gate 3: SCA / Dependency Scanning (npm audit) - Member 3
      - name: Gate 3 - Dependency Audit (npm audit)
        run: |
          npm audit --audit-level=critical
        continue-on-error: true

      # Step 5: Build Docker Image
      - name: Build Application Docker Image
        run: |
          docker build -t nodegoat-app:latest .

      # Gate 4: Container Security Scanning (Trivy) - Member 4
      - name: Gate 4 - Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nodegoat-app:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true